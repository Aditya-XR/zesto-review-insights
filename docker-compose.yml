# One command starts everything: docker compose up --build
# API on host port ${API_PORT:-8000}, UI on ${WEB_PORT:-3000}.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: reviews
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env          # create it first: cp .env.example .env
    volumes:
      - ./backend:/app      # code edits (and new migration files) are shared with your machine
    environment:
      DATABASE_URL: postgres://reviews:reviews@db:5432/reviews
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  # Finds themes in the background, so imports return at once and a slow LLM never blocks the API.
  worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://reviews:reviews@db:5432/reviews
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the container's installed packages
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"
